# LNC Newsman — repo-build stack for 10.20.2.1 (Saigon NAS, endpointId=2).
# Host root is /share/Docker on this NAS; do not change it to /home/Docker.
# Built on the host from the Gitea repo (no registry pull), same pattern as wol-vn1.
#
# Portainer env (all optional except the two secrets):
#   DATA_DIR=/share/Docker        host root; data lands in <DATA_DIR>/lnc-newsman
#   PORT=8462                     host port (container always listens on 8000)
#   TZ=Asia/Ho_Chi_Minh
#   MANAGEMENT_KEY=<generated>    admin login key
#   LNC_API_KEYS=<generated>      read-only API key(s), comma separated
#   LNC_MASTER_KEY=<generated>    provider secret store key (64 hex)
#   COOKIE_SECURE=true            served over HTTPS by the Caddy edge (newsman.lengoc.me)
#   ALLOWED_HOSTS=...             Host header allowlist; empty accepts any Host
#   TRUSTED_PROXIES=10.20.0.3     edge peer whose X-Forwarded-For login throttle trusts
#   REGIONS_DIR=/data/regions
#   CONNECTOR_BEARER=<generated>  Business MCP Hub connector token (env_or_cfg)
#   DELEGATION_SECRET=<generated> Hub delegation HMAC secret (env_or_cfg)
#   CONNECTOR_AUDIENCE=lnc-newsman
#   CONNECTOR_MAX_SCOPES=newsman:read,newsman:write
#
# Collector stays off: no source is enabled by the image, and the scheduler only runs
# when an admin turns it on in Settings.
services:
  # Creates the data directory and gives it to the app's uid so the app never needs
  # root. Idempotent, runs on every deploy.
  init-data:
    image: busybox:1.36
    container_name: lnc-newsman-init
    command: ["sh", "-c", "mkdir -p /data/regions && chown -R 10001:10001 /data"]
    volumes:
      - ${DATA_DIR:-/share/Docker}/lnc-newsman:/data
    restart: "no"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  lnc-newsman:
    build: .
    container_name: lnc-newsman
    depends_on:
      init-data:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${PORT:-8462}:8000"
    environment:
      - DATA_DIR=/data
      - PORT=8000
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - REGIONS_DIR=${REGIONS_DIR:-/data/regions}
      - MANAGEMENT_KEY=${MANAGEMENT_KEY:-}
      - LNC_API_KEYS=${LNC_API_KEYS:-}
      - LNC_MASTER_KEY=${LNC_MASTER_KEY:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Business MCP Hub connector. Blank means "use the value stored in /admin".
      - CONNECTOR_BEARER=${CONNECTOR_BEARER:-}
      - DELEGATION_SECRET=${DELEGATION_SECRET:-}
      - CONNECTOR_AUDIENCE=${CONNECTOR_AUDIENCE:-lnc-newsman}
      # Deliberately no default: an empty value means "the code's ceiling applies",
      # which is both scopes this build implements. A compose default would silently
      # become the real ceiling for every deployment that reads this file, and could
      # narrow it below what the code grants without anyone noticing.
      - CONNECTOR_MAX_SCOPES=${CONNECTOR_MAX_SCOPES:-}
      - RUST_LOG=${RUST_LOG:-lnc_newsman=info,tower_http=warn}
    volumes:
      - ${DATA_DIR:-/share/Docker}/lnc-newsman:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      com.centurylinklabs.watchtower.enable: "false"
