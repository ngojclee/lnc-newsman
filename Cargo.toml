[package]
name = "lnc-newsman"
version = "0.8.2"
edition = "2024"
license = "MIT"
description = "LNC Newsman internal news intelligence reader, alerts and MCP API"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
futures-util = "0.3"
hmac = "0.12"
quick-xml = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
http = "1.3"
getrandom = "0.3"
rusqlite = { version = "0.35", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.44", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc", "getrandom"] }
chrono-tz = "0.10.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
