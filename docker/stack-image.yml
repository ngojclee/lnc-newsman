# LNC Newsman — image-pull stack for 10.20.2.1 (Saigon NAS)
# Host root is /share/Docker on this NAS; do not change it to /home/Docker.
# Portainer env: set DATA_DIR, MANAGEMENT_KEY and LNC_API_KEYS before deploy.
services:
  lnc-newsman:
    image: ${LNC_NEWSMAN_IMAGE:-gitea.lengoc.me/apps/lnc-newsman:lnc-latest}
    pull_policy: always
    container_name: lnc-newsman
    restart: unless-stopped
    ports:
      - "${PORT:-8462}:8000"
    environment:
      DATA_DIR: /data
      PORT: "8000"
      TZ: ${TZ:-Europe/Paris}
      MANAGEMENT_KEY: ${MANAGEMENT_KEY:-}
      LNC_API_KEYS: ${LNC_API_KEYS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      REGIONS_DIR: ${REGIONS_DIR:-/data/regions}
      # 64 hex or 32-byte base64. Leave unset to keep the secret store closed.
      LNC_MASTER_KEY: ${LNC_MASTER_KEY:-}
      LNC_MASTER_KEY_OLD: ${LNC_MASTER_KEY_OLD:-}
      LNC_PREVIOUS_MASTER_KEY: ${LNC_PREVIOUS_MASTER_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_IDLE_TTL_SECONDS: ${SESSION_IDLE_TTL_SECONDS:-43200}
      SESSION_MAX_TTL_SECONDS: ${SESSION_MAX_TTL_SECONDS:-604800}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-https://auth.lengoc.me/realms/lengoc}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-lnc-newsman}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_ALLOWED_USERS: ${OIDC_ALLOWED_USERS:-louis}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-}
      OIDC_ALLOWED_HOSTS: ${OIDC_ALLOWED_HOSTS:-auth.lengoc.me}
      LNC_AGENTS_HUB_URL: ${LNC_AGENTS_HUB_URL:-}
      LNC_AGENTS_HUB_TOKEN: ${LNC_AGENTS_HUB_TOKEN:-}
      LNC_AGENT_HUB_URL: ${LNC_AGENT_HUB_URL:-}
      LNC_AGENT_HUB_TOKEN: ${LNC_AGENT_HUB_TOKEN:-}
      CONNECTOR_BEARER: ${CONNECTOR_BEARER:-}
      DELEGATION_SECRET: ${DELEGATION_SECRET:-}
      CONNECTOR_AUDIENCE: ${CONNECTOR_AUDIENCE:-lnc-newsman}
      CONNECTOR_MAX_SCOPES: ${CONNECTOR_MAX_SCOPES:-}
    volumes:
      - ${DATA_DIR:-/share/Docker}/lnc-newsman:/data
